<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청호솔루션 경영진단 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --p:#5B63F6;--p15:#8A91FA;--p2:#AEB8FF;--p3:#E3E8FF;--tint:#F1F4FF;
  --ink:#1E2235;--body:#3B3F52;--sub:#4A4F63;--muted:#6B7088;--line:#E2E5EE;
  --bg:#F6F7FB;--card:#FFFFFF;--gray:#F4F5F8;--gray2:#F7F8FB;--g3:#B7BCCB;
  --good:#1F9D5C;--goodBg:#E6F6EE;--warn:#E59A1A;--warnBg:#FFF4E0;--bad:#D9483B;--badBg:#FDECEA;--coral:#E8613F;--redBg:#FFF3F0;--mint:#C9EBD7;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
.hl{color:var(--p);font-weight:700}.red{color:var(--bad);font-weight:700}.grn{color:var(--good);font-weight:700}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:linear-gradient(90deg,#fff 250px,var(--bg) 250px)}
nav{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px;border-bottom:2px solid var(--p);margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:50%;background:var(--tint);color:var(--p);display:grid;place-items:center;font-weight:800;font-size:13px;border:1px solid var(--p3)}
.brand h1{font-size:16px;margin:0}.brand small{color:var(--muted);font-size:11.5px}
nav button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font:inherit;font-size:13.5px;color:var(--body);cursor:pointer}
nav button .n{color:var(--muted);font-weight:700;width:20px;flex:none}
nav button:hover{background:var(--gray)}
nav button.on{background:var(--tint);color:var(--p);font-weight:700}nav button.on .n{color:var(--p)}
.navfoot{font-size:11px;color:var(--muted);padding:14px 10px;line-height:1.5}
main{padding:28px 36px 60px;max-width:1320px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-top:2px solid var(--p);padding-top:14px;margin-bottom:14px}
.sec{font-size:13px;font-weight:700;color:var(--muted)}
.top h2{font-size:26px;margin:2px 0 0;letter-spacing:-.3px}
.chips{display:flex;gap:6px;flex:none}
.chip{background:var(--tint);border:1px solid var(--p3);color:var(--p);font-weight:700;font-size:12px;border-radius:20px;padding:3px 12px}
.hook{background:var(--tint);border-radius:12px;padding:16px 22px;font-size:20px;font-weight:700;margin-bottom:18px;letter-spacing:-.2px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g64{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.g46{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{font-size:15px;margin:0 0 10px}.card h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.tint{background:var(--tint);border-color:transparent}.soft{background:#EEF0F6;border-color:transparent}.warmbg{background:var(--redBg);border-color:transparent}
.kpi .v{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.15}.kpi .v small{font-size:15px;margin-left:3px}
.kpi .l{font-weight:700;margin-top:4px}.kpi .s{color:var(--muted);font-size:12.5px}
.note{color:var(--sub);font-size:13.5px}.mut{color:var(--muted);font-size:12.5px}
.side{display:grid;gap:12px;margin-top:16px}
.side .card h4{margin:0 0 4px;color:var(--p);font-size:13.5px}.side .card h4:before{content:"◆ "}
.side .card p{margin:0;font-size:13.5px;color:var(--body)}
svg text{font-family:inherit}
.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--p);color:#fff;font-weight:700;padding:7px 8px}
td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center}td:first-child{text-align:left}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.ok{background:var(--goodBg);color:var(--good)}.need{background:var(--redBg);color:var(--coral)}.mid{background:var(--warnBg);color:var(--warn)}.gr{background:var(--gray);color:#8A90A6}
.list{margin:0;padding:0;list-style:none}.list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #F0F1F5}.list li:last-child{border:0}
.ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.list b{display:block}.list span{color:var(--muted);font-size:13px}
.home .tile{cursor:pointer;transition:.15s}.home .tile:hover{border-color:var(--p);transform:translateY(-2px)}
.tile .n{color:var(--p);font-weight:800;font-size:12px}.tile h4{margin:2px 0 6px;font-size:15px}.tile p{margin:0;font-size:13px;color:var(--sub)}
.tile .big{font-size:22px;font-weight:800;color:var(--p);margin-top:6px}
.stage{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.stage .hd{background:var(--gray);padding:12px;text-align:center}.stage .hd b{font-size:17px;display:block}.stage .hd span{font-size:12px;color:var(--muted)}
.stage.now{border-color:var(--p);background:var(--tint)}.stage.now .hd{background:var(--p);color:#fff}.stage.now .hd span{color:#fff}
.stage ul{padding:8px 12px}
.yr{text-align:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.pager{display:flex;justify-content:space-between;margin-top:26px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--body)}
.pager button:hover{border-color:var(--p);color:var(--p)}
.src{margin-top:14px;color:#9AA0B4;font-size:12px}
.bar{height:10px;background:#F3F4F8;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.steps{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:4px 0}
.steps:before{content:"";position:absolute;left:8%;right:8%;top:38px;height:10px;background:linear-gradient(90deg,var(--mint) 0 40%,#EDEFF4 40%)}
.step{position:relative;text-align:center;width:24%}
.step .c{width:76px;height:76px;border-radius:50%;background:#fff;margin:0 auto 8px;display:grid;place-items:center;font-size:26px;font-weight:800}
.qs{columns:2;gap:28px;margin:0;padding-left:20px}.qs li{margin-bottom:8px;break-inside:avoid}
.road .hd{color:#fff;font-weight:700;padding:10px 14px;border-radius:10px 10px 0 0;margin:-16px -18px 10px}
@media (max-width:1000px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  nav{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand,.navfoot{display:none}
  #navlist{display:flex;gap:4px}nav button{flex:none;width:auto;white-space:nowrap}
  main{padding:18px 16px 40px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g64,.g46{grid-template-columns:1fr}
}
@media (max-width:1000px){.stairs>div{margin-top:0!important}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}.hook{font-size:17px}.top h2{font-size:21px}.qs{columns:1}}
@media print{nav,.pager{display:none}.app{display:block}}
</style>
</head>
<body>
<div class="app">
<nav id="nav">
  <div class="brand"><div class="logo">청호</div><div><h1>(주)청호솔루션</h1><small>경영진단 미팅 대시보드 · 2026-11-06</small></div></div>
  <div id="navlist"></div>
  <div class="navfoot">← → 키로 이동 · 0 키로 전체 보기<br>출처: KoDATA 기업종합보고서, 씨오리포트(2026.11.06). 실행 시 전문가 검토가 필요한 참고자료입니다.</div>
</nav>
<main id="main"></main>
</div>
<script>
const C={p:'#5B63F6',p15:'#8A91FA',p2:'#AEB8FF',p3:'#E3E8FF',g3:'#B7BCCB',coral:'#E8613F',bad:'#D9483B',good:'#1F9D5C',mint:'#C9EBD7',muted:'#6B7088',ink:'#1E2235',line:'#E2E5EE'};
const esc=s=>String(s);
const fmt=(v,d=1)=>Number(v).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});

// ---------- SVG chart helpers ----------
function colChart(labels,vals,{colors,unit='',dec=1,h=240,min}={}){
  const W=520,H=h,pb=28,pt=24,mx=Math.max(...vals,0),mn=Math.min(min??0,...vals);
  const rng=mx-mn||1,bw=W/labels.length,y=v=>pt+(mx-v)/rng*(H-pb-pt),y0=y(0);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  labels.forEach((l,i)=>{const v=vals[i],x=i*bw+bw*.22,w=bw*.56,top=Math.min(y(v),y0),hh=Math.max(2,Math.abs(y(v)-y0));
    const c=Array.isArray(colors)?colors[i]:(colors||C.p);
    s+=`<rect x="${x}" y="${top}" width="${w}" height="${hh}" rx="4" fill="${c}"/>`;
    s+=`<text x="${x+w/2}" y="${v<0?top+hh+15:top-7}" text-anchor="middle" font-size="14" font-weight="700" fill="${C.ink}">${fmt(v,dec)}${unit}</text>`;
    s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="13" fill="${C.muted}">${l}</text>`;});
  return s+`<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="${C.line}"/></svg>`;
}
function groupChart(labels,series,{h=240,dec=1,unit=''}={}){
  const W=520,H=h,pb=48,pt=22,mx=Math.max(...series.flatMap(s=>s[1]));
  const gw=W/labels.length,n=series.length,bw=gw*.7/n,y=v=>pt+(mx-v)/mx*(H-pb-pt);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  labels.forEach((l,i)=>{series.forEach(([nm,vs,c],k)=>{const x=i*gw+gw*.15+k*bw,v=vs[i];
    s+=`<rect x="${x+2}" y="${y(v)}" width="${bw-4}" height="${Math.max(2,H-pb-y(v))}" rx="3" fill="${c}"/><text x="${x+bw/2}" y="${y(v)-6}" text-anchor="middle" font-size="13" font-weight="700" fill="${C.ink}">${fmt(v,dec)}${unit}</text>`;});
    s+=`<text x="${i*gw+gw/2}" y="${H-28}" text-anchor="middle" font-size="13" fill="${C.muted}">${l}</text>`;});
  s+=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="${C.line}"/>`;
  return s+legend(series,W,H)+'</svg>';
}
function legend(series,W,H){let x=W/2-series.length*55,s='';series.forEach(([nm,,c])=>{s+=`<rect x="${x}" y="${H-14}" width="10" height="10" rx="2" fill="${c}"/><text x="${x+15}" y="${H-5}" font-size="12.5" fill="${C.muted}">${nm}</text>`;x+=nm.length*13+40;});return s;}
function lineChart(labels,series,{h=260,dec=1,unit='',min,max,labelsOn=true,axis=false}={}){
  const W=520,H=h,pl=axis?40:16,pr=16,pb=series.length>1?48:28,pt=24;
  const all=series.flatMap(s=>s[1]),mx=max??Math.max(...all),mn=min??Math.min(0,...all);
  const x=i=>pl+i*(W-pl-pr)/(labels.length-1),y=v=>pt+(mx-v)/(mx-mn)*(H-pb-pt);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  if(axis){for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#F0F1F5"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${C.muted}">${Math.round(v)}</text>`;}}
  series.forEach(([nm,vs,c])=>{s+=`<polyline fill="none" stroke="${c}" stroke-width="3" points="${vs.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
    vs.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="#fff" stroke="${c}" stroke-width="2.5"/>`;if(labelsOn)s+=`<text x="${x(i)}" y="${y(v)-10}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${C.ink}">${fmt(v,dec)}${unit}</text>`;});});
  labels.forEach((l,i)=>s+=`<text x="${x(i)}" y="${H-pb+20}" text-anchor="middle" font-size="12.5" fill="${C.muted}">${l}</text>`);
  if(series.length>1)s+=legend(series,W,H);
  return s+'</svg>';
}
function hbar(labels,vals,colors,{unit='',dec=1,max}={}){
  const mx=max??Math.max(...vals);
  return '<div style="display:grid;gap:12px">'+labels.map((l,i)=>`<div style="display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:10px;font-size:13.5px"><span>${l}</span><div class="bar" style="height:22px;border-radius:6px"><i style="width:${vals[i]/mx*100}%;background:${colors[i]};border-radius:6px"></i></div><b>${fmt(vals[i],dec)}${unit}</b></div>`).join('')+'</div>';
}
function donut(vals,colors,center,sub){
  let a=-Math.PI/2,s='<svg class="chart" viewBox="0 0 200 200" style="max-width:200px;margin:auto">';const t=vals.reduce((x,y)=>x+y);
  vals.forEach((v,i)=>{const b=a+v/t*2*Math.PI,r=80,ri=54,l=b-a>Math.PI?1:0;
    const p=(ang,rr)=>`${100+rr*Math.cos(ang)},${100+rr*Math.sin(ang)}`;
    s+=`<path d="M${p(a,r)} A${r},${r} 0 ${l} 1 ${p(b,r)} L${p(b,ri)} A${ri},${ri} 0 ${l} 0 ${p(a,ri)}Z" fill="${colors[i]}" stroke="#fff" stroke-width="2"/>`;a=b;});
  return s+`<text x="100" y="102" text-anchor="middle" font-size="24" font-weight="800" fill="${C.ink}">${center}</text><text x="100" y="122" text-anchor="middle" font-size="11" fill="${C.muted}">${sub}</text></svg>`;
}
const kpi=(v,u,l,s,c='var(--p)')=>`<div class="card kpi"><div class="v" style="color:${c}">${v}<small>${u}</small></div><div class="l">${l}</div><div class="s">${s}</div></div>`;
const side=items=>`<div class="side grid g${Math.min(items.length,3)}">`+items.map(([h,p])=>`<div class="card soft"><h4>${h}</h4><p>${p}</p></div>`).join('')+'</div>';
const icon={ok:['✓','ok'],need:['!','need'],cur:['●','hl'],nxt:['→','gr'],mid:['△','mid']};
const li=(k,a,b)=>`<li><span class="ic ${icon[k][1]==='hl'?'':icon[k][1]}" style="${k==='cur'?'border:2px solid var(--p);color:var(--p);font-size:8px':''}">${icon[k][0]}</span><div><b>${a}</b><span>${b}</span></div></li>`;

// ---------- sections ----------
const S=[
{t:'핵심 요약',sec:'핵심 요약',who:['대표','담당자'],sum:'매출은 업계 상위 25%, 순이익은 평균의 3분의 1',big:'11.2억 가치',src:'KoDATA 기업종합보고서, 씨오리포트(2026.11.06)',
 hook:'"매출은 업계 상위 25%인데, 남는 돈은 평균의 <span class="hl">3분의 1</span>입니다."',
 body:()=>`<p class="note" style="margin:-4px 0 16px">2025년 매출 45.6억원은 동종업계 상위 25% 기준(42.3억)을 넘지만, 당기순이익 0.5억원은 업계 평균(1.39억)의 36% 수준입니다. 버는 힘은 약해졌고 현금은 바닥인데, 이익잉여금과 기업가치는 계속 쌓이고 있습니다. <b>지금이 보상·배당·지분 구조를 손볼 가장 싼 시점</b>입니다.</p>
 <div class="grid g3">${kpi('11.2','억원','현재 기업가치','1주당 1,303원 · 상증세법 보충적 평가')}${kpi('9.7','억원','쌓여만 있는 이익잉여금','설립 13년간 배당 0원')}${kpi('1,918','만원','통장 잔고 (현금성자산)','2년 전 2.8억 → -93%','var(--bad)')}
 ${kpi('63','%','영업이익 중 이자로 나간 몫','이자 0.83억 ÷ 영업이익 1.32억','var(--bad)')}${kpi('45.4','억원','배당·퇴직금 플랜 시 가치 절감','대표 퇴직 시점(18년 후) 기준','var(--good)')}${kpi('30.7','억원','CEO 유고 시 비상자금 부족액','부채상환+필수운영자금 기준','var(--bad)')}</div>
 <div class="grid g2" style="margin-top:16px"><div class="card tint"><h3 class="hl">대표님께 드릴 한 줄</h3><p style="margin:0;font-size:15.5px">"회사에 쌓인 9.7억, 대표님 개인 자산으로 옮기는 설계가 없으면 <b>세금만 커집니다</b>. 퇴직금으로 받으면 세율 9.7%, 급여로 받으면 42.7%입니다."</p></div>
 <div class="card soft"><h3 class="hl">담당자 확인 요청 3가지</h3><ol style="margin:0;padding-left:20px;font-size:15px"><li>정관·임원퇴직금지급규정 보유 여부</li><li>가지급금(단기대여금 0.3억) 발생 사유</li><li>취업규칙 노동청 신고 여부 (상시 22명)</li></ol></div></div>`},
{t:'라이프 사이클별 경영이슈',sec:'기업 라이프사이클',who:['대표'],sum:'경영 13.3년차, 성숙기: 이익을 꺼내고 넘길 단계',big:'성숙기',src:'씨오리포트 기업 라이프 사이클별 경영이슈, KoDATA',
 hook:'경영 13.3년차, 쌓는 단계는 지났습니다. 이제는 <span class="hl">잉여금을 꺼내고 넘기는</span> 성숙기입니다',
 body:()=>{const st=[['3년 미만','창업기','성장을 위한 준비 단계','',[['ok','법인설립','2013.08 신규설립'],['ok','기업부설연구소','2016.09 설치 · 3명'],['need','정관·임원 규정','보수·퇴직금 규정 보유 확인'],['need','노무 기본서류','상시 22명 · 취업규칙 의무']]],
  ['3~10년','성장기','본격성장을 위한 시스템 구축','',[['ok','특허·상표권 등록','특허 21·디자인 8·상표 3'],['need','벤처·이노비즈·메인비즈','3종 모두 미인증'],['need','배당정책','잉여금 9.7억 · 배당 0원'],['need','CEO 보장 자산','비상자금 30.7억 부족']]],

  <p class="src">출처: KoDATA 기업종합보고서(2026.11.06), 씨오리포트(2026.11.06). 기준 결산 2025.12.31. 카드를 누르면 상세 화면으로 이동합니다.</p>`;
}
function page(i){
  const s=S[i-1];
  return `<div class="top"><div><div class="sec">${String(i).padStart(2,'0')} · ${s.sec}</div><h2>${s.t}</h2></div><div class="chips">${s.who.map(w=>`<span class="chip">${w}</span>`).join('')}</div></div>
  <div class="hook">${s.hook}</div>${s.body()}<p class="src">출처: ${s.src}</p>
  <div class="pager"><button data-go="${i-1}">← ${i>1?S[i-2].t:'전체 보기'}</button>${i<S.length?`<button data-go="${i+1}">${S[i].t} →</button>`:'<button data-go="0">전체 보기 →</button>'}</div>`;
}
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(S.length,i));
  document.getElementById('main').innerHTML=cur?page(cur):home();
  document.querySelectorAll('#navlist button').forEach(b=>b.classList.toggle('on',+b.dataset.go===cur));
  try{history.replaceState(null,'','#'+cur)}catch(e){}
  window.scrollTo(0,0);
}
document.getElementById('navlist').innerHTML=`<button data-go="0"><span class="n">◎</span>전체 보기</button>`+S.map((s,i)=>`<button data-go="${i+1}"><span class="n">${String(i+1).padStart(2,'0')}</span>${s.t}</button>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key==='0'||e.key==='Home')go(0)});
go(parseInt((location.hash||'#0').slice(1))||0);
</script>

 "6": "현금과 차입 경보입니다. 통장에 남은 돈은 1,918만 원으로, 한 달 매출의 5퍼센트입니다. 2년 사이 93퍼센트가 줄었습니다. 영업이익 1억 3천2백만 원 가운데 8천3백만 원, 즉 63퍼센트가 이자로 나가고 있습니다. 장기차입금은 21억 7천만 원입니다. 또 총자산의 47퍼센트가 개발비 같은 무형자산이라, 상각이나 손상이 생기면 자본이 바로 줄고 금융기관 평가에서도 불리합니다. 이익이 장부에만 쌓이고 현금이 없으면, 배당과 퇴직금, 세금을 낼 때 결국 차입으로 메워야 합니다.",
 "7": "비용 구조입니다. 종업원 1인당 매출이 2억 8천6백만 원에서 1억 2천만 원으로 줄었습니다. 2년 사이 사람은 23퍼센트 늘었는데 매출은 줄었기 때문입니다. 경비율은 꾸준히 낮아지고 있어 원가 관리는 잘 되고 있습니다. 다만 제조 노무비 비중이 매출의 2.9퍼센트에서 12퍼센트로 올랐습니다. 연구개발비는 2억 1천만 원으로 매출의 4.7퍼센트이니, 연구소 세액공제 적용과 사후관리 서류를 확인해 두셔야 합니다.",
 "8": "기업가치 미래 시뮬레이션입니다. 지금 11억 2천만 원인 회사가 업종 평균 성장률을 가정하면 20년 뒤 201억 원이 됩니다. 현재 1주당 가치는 1,303원으로, 액면가의 2.6배입니다. 같은 지분 10퍼센트를 성년 자녀분께 증여할 때, 지금 하면 증여세가 602만 원이지만 2036년에 하면 약 8천9백만 원으로, 약 15배가 됩니다. 최근 2년 순이익이 낮아 주가가 눌려 있는 지금이, 주식을 옮기기에 가장 싼 시점입니다.",
 "9": "배당과 퇴직금 플랜의 효과입니다. 매년 2억 원씩 배당하고, 대표님 퇴직금 8억 9천만 원을 규정으로 설계하면, 대표님 퇴직 예정인 2044년 기업가치가 155억 5천만 원에서 110억 1천만 원으로, 45억 4천만 원 줄어듭니다. 기업가치가 낮아지면 그만큼 승계 비용도 줄어듭니다. 실행 순서는 정관 정비, 중간배당, 임원퇴직금 규정, 그리고 매년 재평가입니다. 다만 지금 현금이 1,900만 원 정도뿐이라, 첫해는 배당 규모를 줄여 단계적으로 시작하시길 권합니다.",
 "10": "대표님 보상 설계입니다. 똑같이 6억 3천8백만 원을 받으셔도, 급여로 받으면 세금과 4대보험이 2억 7천3백만 원, 배당으로 받으면 2억 5천5백만 원, 퇴직금으로 받으면 6천2백만 원입니다. 퇴직금이 가장 유리합니다. 현재 임원 여섯 분의 급여 합계는 연 5,150만 원이라, 이 수준으로는 충분한 퇴직금을 만들기 어렵습니다. 급여 수준과 지급배수를 함께 설계하고, 연봉 일부를 2천만 원 이하 배당으로 나누면 총 실효세율을 더 낮출 수 있습니다. 출발점은 임원퇴직금 지급규정 제정과 주주총회 결의입니다.",
 "11": "자기주식과 이익소각입니다. 신이익소각의 적합 요건 네 가지 가운데 세 가지를 충족합니다. 가족 주주 구성, 자본금 3억 원 이상, 충분한 미처분이익잉여금입니다. 부채비율은 업종보다 높지만 표준 기준으로는 양호 구간입니다. 방식은 이렇습니다. 대표님 지분을 배우자에게 시가로 증여하면 10년간 6억 원까지 공제됩니다. 이후 회사가 그 주식을 시가에 사들이면 양도차익이 없고, 이를 이익소각하면 잉여금이 줄어 주가도 안정됩니다. 잉여금 9억 7천만 원을 대표님 가족 자산으로 옮기는 통로입니다. 다만 취득 대금이 배우자에게 실질적으로 귀속돼야 하는 등 실행 전 주의사항이 있습니다.",
 "12": "제도, 인증, 노무입니다. 청년을 정규직으로 채용하면 1명당 720만 원을 지원받을 수 있고, 안전보건 관리체계 컨설팅과 유연근무 컨설팅은 무료입니다. 상시 22명 사업장이므로 취업규칙 작성과 노동청 신고가 의무이고, 미신고 시 과태료가 최대 500만 원입니다. 근로계약서, 임금명세서, 연차 관리도 함께 점검해야 합니다. 기업부설연구소는 연구보고서와 연구노트를 5년간 보관해야 세액공제가 유지됩니다.",
 "13": "기업규정 기본 패키지입니다. 임원퇴직금 규정 하나로 비용 인정되는 퇴직금이 3억 원에서 8억 9천만 원으로, 약 3배가 됩니다. 규정이 없으면 퇴직 전 1년 총급여의 10분의 1에 근속연수를 곱한 금액까지만 인정되기 때문입니다. 정관에는 중간배당과 이익소각 조항을 우선 반영합니다. 복리후생비는 인건비 대비 8.2퍼센트로 적정 수준이니 지급 기준을 문서로 남기시면 됩니다. 담당자께는 정관 사본, 임원 보수와 퇴직금 규정의 주주총회 결의 여부, 취업규칙 신고필증 확인을 부탁드립니다.",
 "14": "업종별 인증전략입니다. 인증 사다리 다섯 칸 가운데 두 칸, 기업부설연구소와 특허는 이미 올랐습니다. 수도계량기 제조는 기술제조업이라 이노비즈 경로가 맞고, 다음 단계는 벤처 인증, 그리고 이노비즈입니다. 연구소와 특허 21건이 있어 벤처 요건에 가깝습니다. 인증을 받으면 정책자금과 보증 우대, 조달 가점을 기대할 수 있고, 장기차입금 21억 7천만 원의 금리 부담을 줄이는 데도 연결됩니다.",
 "15": "마지막으로 실행 로드맵입니다. 열두 개 과제를 세 단계로 정리했습니다. 즉시, 1개월에서 3개월 안에는 정관과 임원 규정 정비, 가지급금 3천만 원 정리, 대표님 유고 대비, 노무 서류 점검을 합니다. 6개월 안에는 고용지원금 신청, 인증 착수, 급여와 배당 믹스 설계, 현금흐름 관리를 진행합니다. 1년 이상 중장기로는 정기 배당 개시, 지분 이동, 자기주식 이익소각, 퇴직금 재원 적립을 추진합니다. 회사는 튼튼합니다. 쌓인 이익이 대표님 것이 되는 통로를 만드는 것, 그것이 이번 컨설팅의 목표입니다."
};
(function(){
  const ss=window.speechSynthesis;
  const $=id=>document.getElementById(id);
  const box=$('vx'),cap=$('vxTxt'),pg=$('vxPg'),bar=$('vxBar'),sel=$('vxVoice'),warn=$('vxWarn');
  const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>이 화면 듣기';
  const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>일시정지';
  const ICON_RESUME='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>이어 듣기';
  const store={get(k){try{return localStorage.getItem('vx.'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('vx.'+k,v)}catch(e){}}};
  if(!ss||typeof SpeechSynthesisUtterance==='undefined'){
    $('vxFab').addEventListener('click',()=>box.classList.add('open'));$('vxClose').addEventListener('click',()=>box.classList.remove('open'));
    $('vxPlay').innerHTML=ICON_PLAY;$('vxPlay').disabled=true;warn.style.display='block';
    warn.textContent='이 브라우저는 음성 읽기를 지원하지 않습니다. Microsoft Edge 또는 Chrome으로 열어 주세요.';return;
  }

  /* ---- 목소리 고르기: 한국어 여성 · 자연스러운(Neural/Online) 목소리 우선 ---- */
  const FEMALE=/sunhi|선희|jimin|지민|seohyeon|서현|soonbok|순복|yujin|유진|heami|해미|yuna|유나|sora|소라|seoyeon|서연|google 한국|google korean|female|여성|여자/i;
  const MALE=/injoon|인준|hyunsu|현수|bongjin|봉진|gookmin|국민|minsu|민수|jihun|지훈|\bmale\b|남성|남자/i;
  function score(v){
    const n=v.name+' '+(v.voiceURI||'');let s=0;
    if(FEMALE.test(n))s+=100;else if(MALE.test(n))s-=200;else s+=10;
    if(/natural|neural|online|premium|enhanced/i.test(n))s+=40;
    if(/sunhi|선희/i.test(n))s+=15;
    if(/google/i.test(n))s+=20;
    if(/yuna|유나/i.test(n))s+=12;
    return s;
  }
  let voices=[],voice=null;
  function loadVoices(){
    voices=ss.getVoices().filter(v=>/^ko([-_]|$)/i.test(v.lang)).sort((a,b)=>score(b)-score(a));
    if(voices.some(v=>!MALE.test(v.name)))voices=voices.filter(v=>!MALE.test(v.name));
    if(!voices.length){
      sel.innerHTML='<option>한국어 목소리 없음</option>';$('vxVoiceName').textContent='한국어 목소리를 찾지 못했습니다';
      warn.style.display='block';
      warn.innerHTML='이 기기에 한국어 음성이 설치돼 있지 않습니다. Windows: 설정 → 시간 및 언어 → 음성 → "음성 추가"에서 한국어 설치. 또는 Microsoft Edge·Chrome으로 열면 온라인 한국어 목소리를 쓸 수 있습니다.';
      return;
    }
    warn.style.display='none';
    sel.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name.replace(/^Microsoft\s*/,'').replace(/ - Korean.*$/,'')}${FEMALE.test(v.name)?' · 여성':MALE.test(v.name)?' · 남성':''}${v.localService?'':' · 온라인'}</option>`).join('');
    const saved=store.get('voice2');let idx=saved?voices.findIndex(v=>v.name===saved):-1;
    if(idx<0)idx=0;sel.value=idx;voice=voices[idx];showVoice();
  }
  function showVoice(){if(voice)$('vxVoiceName').textContent=voice.name.replace(/^Microsoft\s*/,'').replace(/ - Korean.*$/,'')+(voice.localService?' · 오프라인 가능':' · 인터넷 필요');}
  loadVoices();if('onvoiceschanged' in ss)ss.addEventListener?ss.addEventListener('voiceschanged',loadVoices):(ss.onvoiceschanged=loadVoices);
  setTimeout(loadVoices,700);
  sel.addEventListener('change',()=>{voice=voices[+sel.value];store.set('voice2',voice?voice.name:'');showVoice();if(state==='playing'){speakFrom(idx)}else sample();});
  const toneSel=$('vxTone');toneSel.value=store.get('tone')||'0.86';if(!toneSel.value)toneSel.value='0.86';
  toneSel.addEventListener('change',()=>{store.set('tone',toneSel.value);if(state==='playing')speakFrom(idx);else sample();});
  function sample(){if(state==='playing')return;ss.cancel();const u=new SpeechSynthesisUtterance('안녕하세요. 오늘 경영진단 결과를 설명해 드리겠습니다.');u.lang='ko-KR';if(voice)u.voice=voice;u.rate=+rateSel.value||0.95;u.pitch=+toneSel.value||1;setTimeout(()=>ss.speak(u),60);}
  $('vxTry').addEventListener('click',sample);
  const rateSel=$('vxRate');rateSel.value=store.get('rate')||'0.95';if(!rateSel.value)rateSel.value='0.95';
  rateSel.addEventListener('change',()=>{store.set('rate',rateSel.value);if(state==='playing')speakFrom(idx)});
  const auto=$('vxAuto');auto.checked=store.get('auto')==='1';auto.addEventListener('change',()=>store.set('auto',auto.checked?'1':'0'));

  /* ---- 대본 준비: 문장 단위로 나눠서 읽기 (Chrome 긴 문장 끊김 방지) ---- */
  function clean(t){return String(t).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();}
  function speakable(t){ // 화면용 기호를 말로 바꿈 (대본에 남은 기호 대비)
    return t.replace(/\(주\)/g,'').replace(/(\d)\s*%p/g,'$1퍼센트포인트').replace(/(\d)\s*%/g,'$1퍼센트')
      .replace(/(\d{4})\.(\d{1,2})\.(\d{1,2})/g,(m,y,mo,d)=>`${y}년 ${+mo}월 ${+d}일`).replace(/(\d{4})\.(\d{2})(?!\d)/g,(m,y,mo)=>`${y}년 ${+mo}월`)
      .replace(/→/g,', ').replace(/[·•◆]/g,', ').replace(/~/g,'에서 ').replace(/\s+/g,' ');
  }
  function sentencesFor(i){
    let t=NARR[i]||NARR[String(i)];
    if(!t){const m=document.getElementById('main');const h=m.querySelector('h2'),k=m.querySelector('.hook');t=(h?clean(h.textContent)+'. ':'')+(k?clean(k.textContent):'');}
    if(Array.isArray(t))t=t.join(' ');
    return clean(t).split(/(?<=[.?!])\s+(?=\S)/).map(s=>s.trim()).filter(Boolean);
  }

  /* ---- 재생 상태 ---- */
  let state='idle',list=[],idx=0,page=0,token=0,watchdog=null;
  const curPage=()=>typeof cur!=='undefined'?cur:0;
  const curPageSafe=()=>state==='idle'?curPage():page;
  const total=()=>typeof S!=='undefined'?S.length:0;
  function title(i){return i===0?'전체 보기':`${String(i).padStart(2,'0')} · ${S[i-1].t}`;}
  function ui(){
    $('vxPlay').innerHTML=state==='playing'?ICON_PAUSE:state==='paused'?ICON_RESUME:ICON_PLAY;
    box.classList.toggle('playing',state==='playing');document.body.classList.toggle('vx-reading',state==='playing');
    $('vxMPlay').innerHTML=state==='playing'?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
    $('vxMTxt').textContent=(state==='idle'?'음성 설명 · ':'')+title(curPageSafe())+(state!=='idle'&&list.length?`  ${Math.min(idx+1,list.length)}/${list.length}`:'');
    bar.style.width=list.length?((state==='idle'?0:idx+(state==='playing'?0.5:0))/list.length*100)+'%':'0';
  }
  function show(){pg.textContent=title(page)+(list.length?`  ·  ${Math.min(idx+1,list.length)}/${list.length}`:'');cap.textContent=list[idx]||'';}
  function speakFrom(n){
    const my=++token;ss.cancel();clearTimeout(watchdog);
    if(n>=list.length){finishPage();return;}
    idx=Math.max(0,n);state='playing';show();ui();
    const u=new SpeechSynthesisUtterance(speakable(list[idx]));
    u.lang='ko-KR';if(voice)u.voice=voice;u.rate=+rateSel.value||0.95;u.pitch=+toneSel.value||1;u.volume=1;
    let started=false;
    u.onstart=()=>{started=true};
    u.onend=()=>{if(my!==token)return;clearTimeout(watchdog);speakFrom(idx+1)};
    u.onerror=e=>{if(my!==token||e.error==='interrupted'||e.error==='canceled')return;fallback(e.error)};
    // 온라인 목소리가 인터넷 없이 응답하지 않을 때 기기 내장 목소리로 전환
    if(voice&&!voice.localService)watchdog=setTimeout(()=>{if(my===token&&!started)fallback('timeout')},5000);
    setTimeout(()=>{if(my===token)ss.speak(u)},60);
  }
  function fallback(why){
    const local=voices.find(v=>v.localService&&v!==voice&&score(v)>0)||voices.find(v=>v.localService&&v!==voice);
    if(voice&&!voice.localService&&local){
      voice=local;sel.value=voices.indexOf(local);showVoice();
      warn.style.display='block';warn.textContent='온라인 목소리에 연결되지 않아 기기 내장 목소리로 바꿨습니다.';
      speakFrom(idx);
    }else{state='idle';ui();warn.style.display='block';warn.textContent='음성을 재생하지 못했습니다 ('+why+'). 다른 목소리를 골라 보세요.';}
  }
  function finishPage(){
    if(auto.checked&&curPage()<total()){autoNav=true;go(curPage()+1);return;}
    state='idle';idx=list.length;ui();bar.style.width='100%';
  }
  let autoNav=false;
  function startPage(){page=curPage();list=sentencesFor(page);speakFrom(0);}
  function pause(){token++;ss.cancel();clearTimeout(watchdog);state='paused';ui();}
  function stop(){token++;ss.cancel();clearTimeout(watchdog);state='idle';idx=0;ui();page=curPage();list=sentencesFor(page);show();cap.textContent='▶ 를 누르면 지금 보고 있는 화면을 설명합니다.';}
  function toggle(){
    if(state==='playing')pause();
    else if(state==='paused'&&page===curPage())speakFrom(idx);
    else startPage();
  }
  $('vxPlay').addEventListener('click',toggle);
  $('vxStop').addEventListener('click',stop);
  $('vxPrev').addEventListener('click',()=>{if(state==='idle'){page=curPage();list=sentencesFor(page);}speakFrom(Math.max(0,idx-1))});
  $('vxNext').addEventListener('click',()=>{if(state==='idle'){page=curPage();list=sentencesFor(page);idx=-1;}speakFrom(idx+1)});
  $('vxFab').addEventListener('click',()=>{setMini(false);page=curPage();if(state==='idle'){list=sentencesFor(page);show();cap.textContent='▶ 를 누르면 지금 보고 있는 화면을 설명합니다.';}});
  $('vxClose').addEventListener('click',()=>{box.classList.remove('open','mini');if(state!=='idle')stop();});
  function setMini(on){box.classList.add('open');box.classList.toggle('mini',on);store.set('mini',on?'1':'0');ui();}
  $('vxMin').addEventListener('click',()=>setMini(true));
  $('vxExpand').addEventListener('click',()=>setMini(false));
  $('vxMPlay').addEventListener('click',toggle);
  $('vxMStop').addEventListener('click',stop);
  new MutationObserver(()=>document.body.classList.toggle('vx-open',box.classList.contains('open')&&!box.classList.contains('mini'))).observe(box,{attributes:true,attributeFilter:['class']});

  /* 화면 크기: 대시보드 본문을 축소/확대, '한 화면에 맞춤'은 스크롤 없이 화면 전체가 보이도록 자동 축소 */
  const mainEl=document.getElementById('main');
  let zoom=store.get('zoom')||'1';
  function applyZoom(){
    let z;
    if(zoom==='fit'){
      mainEl.style.zoom=1;const top=mainEl.getBoundingClientRect().top+window.scrollY;
      const h=mainEl.scrollHeight-parseFloat(getComputedStyle(mainEl).paddingBottom||0)+28;
      z=Math.max(.5,Math.min(1,(window.innerHeight-Math.max(0,top)-(box.classList.contains('open')?60:8))/h));
    }else z=Math.max(.5,Math.min(1.3,+zoom||1));
    mainEl.style.zoom=z;$('vxZv').textContent=Math.round(z*100)+'%';
    $('vxZFit').classList.toggle('on',zoom==='fit');$('vxMFit').style.color=zoom==='fit'?'var(--p,#5B63F6)':'';
  }
  function setZoom(v){zoom=String(v);store.set('zoom',zoom);applyZoom();}
  const curZ=()=>parseFloat(mainEl.style.zoom)||1;
  $('vxZOut').addEventListener('click',()=>setZoom(Math.max(.5,Math.round((curZ()-.1)*10)/10)));
  $('vxZIn').addEventListener('click',()=>setZoom(Math.min(1.3,Math.round((curZ()+.1)*10)/10)));
  $('vxZFit').addEventListener('click',()=>setZoom(zoom==='fit'?1:'fit'));
  $('vxMFit').addEventListener('click',()=>setZoom(zoom==='fit'?1:'fit'));
  window.addEventListener('resize',()=>{if(zoom==='fit')applyZoom()});
  if(store.get('mini')==='1')box.classList.add('mini');
  applyZoom();
  ui();

  /* 화면 이동과 연동: 읽는 중에 화면을 넘기면 새 화면을 이어서 읽음 */
  const _go=go;
  go=function(i){
    const was=state;_go(i);applyZoom();
    if(autoNav||was==='playing'){autoNav=false;box.classList.add('open');startPage();}
    else if(was==='paused'){stop();}
    else if(box.classList.contains('open')){page=curPage();list=sentencesFor(page);idx=0;show();cap.textContent='▶ 를 누르면 지금 보고 있는 화면을 설명합니다.';}

    ui();
  };
  document.addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('input,select,textarea'))return;
    if(e.code==='Space'){e.preventDefault();box.classList.add('open');toggle();}
    else if(e.key==='Escape'){stop();}
    else if(e.key==='v'||e.key==='V'||e.key==='ㅍ'){if(!box.classList.contains('open'))setMini(false);else setMini(!box.classList.contains('mini'));}
    else if(e.key==='f'||e.key==='F'||e.key==='ㄹ'){setZoom(zoom==='fit'?1:'fit');}
  });
  window.addEventListener('beforeunload',()=>ss.cancel());
})();
</script>
